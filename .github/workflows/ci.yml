name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Site smoke suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        # Playwright downloads its own Chromium and WebKit; the runner image's Google Chrome apt source
        # is not needed and has broken apt-get update before (index hash mismatch), so drop it first.
        run: |
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          npx playwright install --with-deps chromium webkit
      - name: Stage site
        # Exactly what gets deployed, and exactly what gets tested below.
        run: |
          mkdir -p dist
          cp -r index.html css js assets media counterspell dist/
          # The footer badge links to the run that built this page, not the workflow list.
          sed -i "s#https://github.com/${{ github.repository }}/actions/workflows/ci.yml\"#${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"#" dist/index.html
      - name: Smoke suite against the staged site
        run: SITE_DIR=dist npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
